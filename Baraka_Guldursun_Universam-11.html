<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#04301b">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Baraka"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baraka · Guldursun Universam</title>
<style>
:root{
  --g900:#06371f;--g800:#0a4d2c;--g700:#0f6b3c;--g600:#14894e;--g500:#1fa862;--g100:#dcf5e6;--g50:#f0fbf4;
  --o500:#ff8a1f;--o400:#ffa94d;--o100:#fff0dc;
  --r500:#ef4444;--b500:#3b82f6;--p500:#8b5cf6;
  --ink:#10231a;--mut:#62776b;--line:#e3ece6;--card:#fff;--bg:#f4f8f5;
  --sh:0 6px 24px rgba(15,107,60,.10);--sh2:0 14px 40px rgba(6,55,31,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 20% -10%,#bff0d3 0,transparent 60%),radial-gradient(900px 500px at 100% 110%,#ffe2bd 0,transparent 55%),#e9f3ec;
  display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.app{height:min(880px,96vh);height:min(880px,96dvh);border-radius:38px;box-shadow:var(--sh2),0 0 0 10px #0d1f16}}
.screen{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;scroll-behavior:smooth}
.screen::-webkit-scrollbar{display:none}
/* top hero */
.hero{position:relative;background:linear-gradient(150deg,var(--g800),var(--g600) 70%,var(--g500));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 78px;border-radius:0 0 34px 34px;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{width:240px;height:240px;right:-70px;top:-80px}
.hero:after{width:150px;height:150px;left:-50px;bottom:-60px;background:rgba(255,169,77,.18)}
.brandrow{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:2px}
.logo svg{width:100%;height:100%}
.brand b{font-size:19px;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{font-size:11px;opacity:.85;letter-spacing:.4px}
.pts{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.hello{position:relative;z-index:1;margin-top:22px}
.hello h1{font-size:24px;line-height:1.2;font-weight:800}
.hello p{margin-top:6px;opacity:.9;font-size:14px}
.stats{margin:-52px 16px 0;position:relative;z-index:2;background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px 8px;display:grid;grid-template-columns:repeat(3,1fr)}
.stat{text-align:center;padding:0 4px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--g700)}
.stat span{font-size:11px;color:var(--mut)}
.sec{padding:22px 18px 0}
.sec h2{font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 a{font-size:13px;color:var(--g600);font-weight:700;cursor:pointer}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.qcard{border-radius:22px;padding:16px;color:#fff;text-align:left;position:relative;overflow:hidden;min-height:128px;box-shadow:var(--sh);transition:transform .15s}
.qcard:active{transform:scale(.97)}
.qcard.a{background:linear-gradient(145deg,#ff9a3c,#ff6a1f)}
.qcard.b{background:linear-gradient(145deg,#1fa862,#0a6b3c)}
.qcard .ic{font-size:34px}
.qcard b{display:block;font-size:16px;margin-top:10px}
.qcard small{opacity:.92;font-size:12px}
.qcard:after{content:"";position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.16)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:14px}
.feed{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.feeditem{display:flex;gap:12px;align-items:center}
.dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.feeditem p{font-size:13.5px;line-height:1.35}
.feeditem small{color:var(--mut);font-size:11.5px}
.tip{margin-top:14px;background:linear-gradient(135deg,var(--o100),#fff);border:1px solid #ffe0b8;border-radius:22px;padding:16px;display:flex;gap:12px}
.tip b{display:block;margin-bottom:3px}
.tip p{font-size:13px;color:#6b5633;line-height:1.4}
/* header (inner pages) */
.ph{padding:calc(env(safe-area-inset-top) + 18px) 18px 8px}
.ph h1{font-size:26px;font-weight:800}
.ph p{color:var(--mut);font-size:13.5px;margin-top:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);transition:.15s}
.chip.on{background:var(--g700);color:#fff;border-color:var(--g700);box-shadow:0 4px 12px rgba(15,107,60,.3)}
/* food */
.grid{padding:8px 18px 0;display:flex;flex-direction:column;gap:14px}
.food{background:#fff;border-radius:24px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.food .top{display:flex;gap:14px;padding:14px;align-items:center}
.thumb{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;font-size:42px;flex:none;position:relative}
.food h3{font-size:16px;font-weight:800}
.food .shop{font-size:12px;color:var(--mut);margin-top:2px}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.tag.free{background:#e6f9ee;color:var(--g700)}
.tag.sale{background:var(--o100);color:#c25f00}
.tag.time{background:#eef2ff;color:#4655c9}
.food .bot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px dashed var(--line);background:#fbfdfc}
.price b{font-size:18px;font-weight:800;color:var(--g700)}
.price s{color:#9aa9a0;font-size:12px;margin-left:6px}
.price small{display:block;font-size:11px;color:var(--mut)}
.btn{background:linear-gradient(135deg,var(--g500),var(--g700));color:#fff;font-weight:800;padding:12px 18px;border-radius:16px;font-size:14px;box-shadow:0 6px 16px rgba(15,107,60,.3);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.o{background:linear-gradient(135deg,var(--o400),var(--o500));box-shadow:0 6px 16px rgba(255,138,31,.35)}
.btn.gh{background:var(--g50);color:var(--g700);box-shadow:none}
.btn[disabled]{background:#cfd9d3;box-shadow:none;cursor:default}
.btn.w{width:100%;padding:15px;font-size:15px}
.bar{height:6px;border-radius:6px;background:#e8f0ea;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o400),var(--g500));border-radius:6px}
/* map */
.mapwrap{cursor:pointer;margin:8px 18px 0;border-radius:26px;overflow:hidden;box-shadow:var(--sh);position:relative;background:#e8f1e4;touch-action:manipulation}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);width:36px;height:44px;display:grid;place-items:start center;padding-top:3px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));transition:transform .15s}
.pin:active{transform:translate(-50%,-100%) scale(1.15)}
.pin:before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:var(--c);clip-path:path("M18 0C8 0 0 8 0 18c0 13 18 26 18 26s18-13 18-26C36 8 28 0 18 0z");border-radius:0}
.pin span{position:relative;font-size:16px;margin-top:5px}
.pin.me{--c:var(--b500);animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translate(-50%,-110%)}}
.legend{display:flex;gap:10px;padding:12px 18px 0;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.fab{position:absolute;right:18px;bottom:96px;z-index:5;background:linear-gradient(135deg,var(--o400),var(--o500));color:#fff;font-weight:800;border-radius:999px;padding:15px 20px;box-shadow:0 10px 26px rgba(255,138,31,.45);display:flex;gap:8px;align-items:center}
.rep{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border:0}
.rep h4{font-size:14.5px}
.rep small{color:var(--mut);font-size:12px}
.status{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.s0{background:#eef2ff;color:#4655c9}.s1{background:var(--o100);color:#c25f00}.s2{background:#e0f2fe;color:#0369a1}.s3{background:#e6f9ee;color:var(--g700)}
/* sheet */
.veil{cursor:pointer;position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(6,25,15,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;z-index:21;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-height:90%;overflow-y:auto;padding:12px 20px calc(env(safe-area-inset-bottom) + 24px)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:#d6e0d9;margin:0 auto 14px}
.sheet h2{font-size:21px;font-weight:800}
.sheet .sub{color:var(--mut);font-size:13.5px;margin:4px 0 14px}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:14px 0 8px}
textarea,input[type=text]{-webkit-appearance:none;appearance:none;width:100%;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;font:inherit;font-size:16px;background:#fbfdfc;outline:0;resize:none}
textarea:focus,input:focus{border-color:var(--g500)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{border:1.5px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:700;color:var(--mut);background:#fff}
.cat span{display:block;font-size:24px;margin-bottom:3px}
.cat.on{border-color:var(--g500);background:var(--g50);color:var(--g700)}
.minimap{margin-top:0}
.qr{width:170px;height:170px;margin:10px auto;padding:10px;border-radius:20px;background:#fff;border:2px dashed var(--g500)}
.code{font-size:38px;font-weight:900;letter-spacing:10px;text-align:center;color:var(--g700)}
.steps{display:flex;margin:12px 0 4px}
.step{flex:1;text-align:center;font-size:10.5px;color:var(--mut);position:relative}
.step:before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#dde7e0;margin:0 auto 6px;position:relative;z-index:1}
.step:after{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:#dde7e0}
.step:first-child:after{display:none}
.step.d{color:var(--g700);font-weight:700}
.step.d:before,.step.d:after{background:var(--g500)}
/* nav */
nav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:68px;border-radius:26px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(6,55,31,.22);display:flex;justify-content:space-around;align-items:center;z-index:10;border:1px solid rgba(255,255,255,.8)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#8aa093;padding:8px 9px;border-radius:18px;transition:.2s}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--g700);background:var(--g50)}
.toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-140%);background:var(--g900);color:#fff;padding:12px 18px;border-radius:16px;font-size:13.5px;font-weight:600;z-index:40;transition:transform .35s cubic-bezier(.2,.9,.3,1);box-shadow:var(--sh2);max-width:88%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.prof{display:flex;gap:14px;align-items:center}
.ava{width:68px;height:68px;border-radius:24px;background:linear-gradient(135deg,var(--o400),var(--g500));display:grid;place-items:center;font-size:34px;color:#fff}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.badge{background:#fff;border-radius:20px;padding:14px 6px;text-align:center;box-shadow:var(--sh);font-size:11.5px;font-weight:700}
.badge span{display:block;font-size:30px;margin-bottom:4px}
.badge.lock{opacity:.4;filter:grayscale(1)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13.5px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}


/* rahbariyat */
.lhero{margin:8px 18px 0;border-radius:26px;padding:20px 18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--g800),var(--g600) 70%,var(--g500));box-shadow:var(--sh)}
.lhero.tap{cursor:pointer}.lhero.tap:after{content:"Profil ›";position:absolute;right:14px;bottom:12px;width:auto;height:auto;top:auto;border-radius:999px;background:rgba(255,255,255,.2);padding:5px 12px;font-size:12px;font-weight:700}
.fprof{margin:8px 18px 0;text-align:center}
.fphoto{width:210px;height:210px;margin:6px auto 0;border-radius:50%;padding:6px;background:linear-gradient(135deg,var(--o400),var(--g500));box-shadow:var(--sh)}
.fphoto img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;border:4px solid #fff;display:block}
.fprof h2{font-size:24px;font-weight:800;margin-top:16px}
.fprof .pos{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--g700);background:var(--g50);border:1px solid var(--g100);padding:5px 14px;border-radius:999px}
.fbox{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px;margin-top:16px;text-align:left}
.fbox small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.fbox p{font-size:14px;line-height:1.55;margin-top:4px}
.fbtn{display:flex;gap:10px;margin-top:14px}
.fbtn a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,var(--g600),var(--g800));color:#fff}
.fbtn a.t{background:var(--g50);color:var(--g700);border:1px solid var(--g100)}
.fexp{margin-top:10px;font-size:14px;font-weight:700;color:var(--g800);line-height:1.4}
.fstats{display:flex;gap:10px;margin-top:16px}
.fstats div{flex:1;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 6px}
.fstats b{display:block;font-size:20px;font-weight:800;color:var(--g700)}
.fstats span{font-size:11px;color:var(--mut);font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fchips span{font-size:12.5px;font-weight:700;color:var(--g700);background:var(--g50);border:1px solid var(--g100);padding:6px 12px;border-radius:999px}
.fassoc{margin-top:16px;border-radius:24px;padding:18px;color:#fff;text-align:left;background:linear-gradient(150deg,#e8730f,#ff8a1f 70%,#ffa94d);box-shadow:var(--sh)}
.fassoc h3{font-size:18px;font-weight:800}.fassoc p{font-size:13px;margin-top:4px;opacity:.95;line-height:1.45}
.fassoc a,.fassoc button{display:block;width:100%;margin-top:12px;text-align:center;text-decoration:none;border:0;cursor:pointer;font-weight:800;font-size:14px;padding:13px;border-radius:16px;background:#fff;color:#c25f00}
.fback{background:none;border:0;font-size:14px;font-weight:700;color:var(--g700);padding:6px 0;margin:4px 18px 0;cursor:pointer}
.mission{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(150deg,var(--g800),var(--g600));box-shadow:var(--sh);position:relative;overflow:hidden}
.mission:after{content:"";position:absolute;right:-36px;top:-36px;width:130px;height:130px;border-radius:50%;background:rgba(255,169,77,.22)}
.mission>*{position:relative;z-index:1}
.mission small{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.9}
.mission h3{font-size:19px;font-weight:800;line-height:1.25;margin-top:6px}
.mission p{font-size:13.5px;line-height:1.55;margin-top:8px;opacity:.96}
.mission ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.mission li{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700}
.mpartner{margin-top:14px;background:#fff;color:var(--g800);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45}
.gd{background:#fff;border-radius:20px;box-shadow:var(--sh);margin-top:10px;overflow:hidden}
.gd summary{padding:15px 16px;font-weight:800;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.gd summary::-webkit-details-marker{display:none}.gd summary:after{content:"＋";color:var(--g600)}.gd[open] summary:after{content:"－"}
.gd ul{padding:0 16px 14px 34px;font-size:13.5px;line-height:1.55;color:var(--ink)}.gd li{margin-top:6px}
.ad{background:#fff;border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.ad .top{display:flex;gap:12px;padding:14px;align-items:center}
.ad .thumb{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}
.ad h3{font-size:16px;font-weight:800}.ad .shop{font-size:12px;color:var(--mut);margin-top:2px}
.adm{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px}.adm span{font-size:12.5px;font-weight:700;background:var(--g50);border:1px solid var(--g100);padding:5px 10px;border-radius:999px}
.add{padding:10px 14px 0;font-size:13.5px;line-height:1.5}
.ad .bot{display:flex;gap:10px;align-items:center;padding:12px 14px;margin-top:12px;border-top:1px dashed var(--line)}
.ld{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.45}.ld li{margin-top:3px}
.ldh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-top:10px;opacity:.85}
.lhero .ld,.lhero .ldh{position:relative;z-index:1}
.snap{background:linear-gradient(145deg,#ff9a3c,#ff6a1f);color:#fff;border-radius:22px;padding:16px;box-shadow:var(--sh)}
.snap p{font-size:13px;line-height:1.45;margin-top:4px;opacity:.96}.sn2{margin:10px 0;font-weight:800;font-size:13px;background:rgba(255,255,255,.2);display:inline-block;padding:4px 12px;border-radius:999px}
.snap .btn{background:#fff;color:#c25f00}
.snapbox{display:grid;place-items:center;min-height:170px;border:2px dashed var(--g500);border-radius:20px;background:var(--g50);text-align:center;color:var(--g700);font-weight:700;cursor:pointer;overflow:hidden}
.snapbox img{width:100%;max-height:260px;object-fit:cover;display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pcard{background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden;position:relative}
.pcard img{width:100%;height:110px;object-fit:cover;display:block}.pcard div{padding:8px 10px}.pcard b{display:block;font-size:12.5px}.pcard small{font-size:11px;color:var(--mut)}
.pcard .x{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:24px;height:24px}
.fact{background:linear-gradient(150deg,var(--g800),var(--g600));color:#fff;border-radius:22px;padding:16px;box-shadow:var(--sh)}

/* ---------- intro (Netflix uslubida) ---------- */
.intro{position:absolute;top:0;right:0;bottom:0;left:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;animation:introOut .9s cubic-bezier(.7,0,.9,.4) 5.4s forwards}
.intro.gone{display:none}
.intro:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(31,168,98,.45),rgba(255,138,31,.12) 45%,transparent 70%);opacity:0;animation:glow 2.6s ease .3s forwards}
.ilogo{position:relative;width:170px;height:170px;opacity:0;transform:scale(.55);filter:blur(14px);animation:logoIn 1.5s cubic-bezier(.2,.8,.2,1) .35s forwards;border-radius:50%;overflow:hidden;box-shadow:0 0 60px rgba(31,168,98,.5)}
.ilogo svg{width:100%;height:100%;display:block}
.ilogo:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 1.1s ease 1.5s forwards}
.itxt{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .3em;padding:0 24px;text-align:center;font-weight:800;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.itxt .w{display:inline-flex}
.itxt .w.s{color:var(--o400);font-weight:600;letter-spacing:.2em;font-size:15px;width:100%;justify-content:center;margin-top:6px}
.itxt i{font-style:normal;display:inline-block;opacity:0;transform:translateY(14px) scale(1.4);filter:blur(6px);animation:ch .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(1.7s + var(--n)*.055s)}
.iskip{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);color:rgba(255,255,255,.55);font-size:12px;font-weight:700;letter-spacing:.5px;padding:8px 12px;border:1px solid rgba(255,255,255,.2);border-radius:999px;opacity:0;animation:fade .5s ease 1s forwards}
.ifound{position:relative;text-align:center;margin-top:-6px;opacity:0;transform:translateY(10px);animation:foundIn 1s cubic-bezier(.2,.8,.2,1) 3.3s forwards}
.ifound small{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600}
.ifound b{display:block;margin-top:6px;font-size:20px;font-weight:800;letter-spacing:.06em;background:linear-gradient(100deg,#ffd9a8,#ffa94d 50%,#ffe3c2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.ifound:before{content:"";display:block;width:46px;height:2px;margin:0 auto 12px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--o400),transparent)}
@keyframes foundIn{to{opacity:1;transform:none}}
@keyframes logoIn{60%{filter:blur(0)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes glow{40%{opacity:1}to{opacity:.8;transform:scale(1.25)}}
@keyframes sweep{to{transform:translateX(120%)}}
@keyframes ch{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes introOut{to{opacity:0;transform:scale(3.2);visibility:hidden}}
@media(prefers-reduced-motion:reduce){.intro{animation-duration:.4s;animation-delay:2.4s}.ilogo,.itxt i,.ifound{animation-duration:.01s;animation-delay:1s}}

function sha256(s){
 const b=new TextEncoder().encode(s),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=128;
 const dv=new DataView(m.buffer);dv.setUint32(n-8,Math.floor(l*8/4294967296));dv.setUint32(n-4,(l*8)>>>0);

 const w=new Uint32Array(64),rr=(x,k)=>(x>>>k)|(x<<(32-k));
 for(let o=0;o<n;o+=64){
  for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);

 }

  const remote=Object.values(await r.json()||{}),ids=new Set(remote.map(c=>String(c.id)));
  let ch=false;
  remote.forEach(c=>{const ex=S.comments.find(x=>String(x.id)===String(c.id));if(!ex){S.comments.push(c);ch=true}else if(c.img&&!ex.img){ex.img=c.img;ch=true}});
  if(remote.length){const minId=Math.min(...remote.map(c=>+c.id)),n=S.comments.length;
   S.comments=S.comments.filter(c=>+c.id<minId||ids.has(String(c.id))||Date.now()-c.id<30000);if(S.comments.length!==n)ch=true}
  S.comments.forEach(c=>{if(!c._s&&c.phone===S.me&&!ids.has(String(c.id))&&Date.now()-c.id>30000){c._s=1;dbPut("comments/"+c.id,c)}});
  if(ch){S.comments.sort((a,b)=>a.id-b.id);save();if(S.tab==="talk"){draftCmText=($("#cm_t")||{}).value||draftCmText;render(true)}}
 }catch(e){console.warn("DB:",e)}
}function handlePhoto(inp){
 const m=ME(),file=inp.files&&inp.files[0];inp.value="";
 if(!m||!file)return;
 if(photosToday()>=PHOTO_LIMIT){toast("Bugungi limit tugadi");return}
 const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{
  const k=Math.min(1,560/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const data=c.toDataURL("image/jpeg",.55);URL.revokeObjectURL(url);
  if(photosToday()>=PHOTO_LIMIT)return;
  if(!S.photos)S.photos=[];
  {const rec={id:Date.now(),phone:m.phone,name:m.name,date:todayKey(),img:data,place:"",when:"Hozir",ts:Date.now()};S.photos.unshift(rec);pushPhoto(rec)}
  S.photos.forEach((p,i)=>{if(i>=12)p.img=null});S.photos=S.photos.slice(0,80);
  m.coins=(m.coins||0)+PHOTO_COIN;S.pts+=5;dbInc(m.phone,PHOTO_COIN);
  addFeed("📸","#e6f9ee",esc(m.name)+" axlat joyini yubordi");
  render(true);save();toast("Yuborildi! +"+PHOTO_COIN+" coin 🪙 ("+photosToday()+"/"+PHOTO_LIMIT+")");
 };
 img.onerror=()=>toast("Rasmni o'qib bo'lmadi");
 img.src=url;
}
document.addEventListener("change",e=>{if(e.target&&e.target.classList&&e.target.classList.contains("camin"))handlePhoto(e.target);if(e.target&&e.target.classList&&e.target.classList.contains("cmin"))handleCmPhoto(e.target)});
const photoGrid=()=>{const l=allPhotos().filter(p=>p.img).slice(0,8);if(!l.length)return"";const m=ME();return `<div class="sec" style="padding-top:4px"><h2>Oxirgi suratlar <span style="font-size:12px;color:var(--mut);font-weight:600">hamma ko'radi</span></h2><div class="pgrid">${l.map(p=>`<div class="pcard"><img src="${p.img}" alt=""><div><b>${esc(p.place||"Mahalla")}</b><small>${esc(p.name)} · ${p.ts?fmtWhen(p.ts):(p.when||"")}</small></div>${((isMod()&&(p.phone!==FOUNDER_PH||isFounder()))||p.phone===m.phone)?`<button class="x" data-a="delph" data-id="${p.id}">✕</button>`:""}</div>`).join("")}</div></div>`};

 if(!d)return;
 const ap=(o,x)=>{if(o&&x)LK.forEach(k=>{if(x[k]!==undefined)o[k]=x[k]})};
 ap(FOUNDER,d.founder);ap(UNI_DIR,d.unidir);ap(BAR_DIR,d.bardir);

 UNI_TEAM.forEach((o,i)=>{o.rid=o.rid||"u"+i});BAR_TEAM.forEach((o,i)=>{o.rid=o.rid||"b"+i});
}

 const m=(RATINGS||{})[rid]||{};let sum=0,n=0,f=null;
 Object.entries(m).forEach(([ph,x])=>{if(ph===FOUNDER_PH)f=x.s;else{sum+=x.s;n++}});
 const pub=n?sum/n:null;
 return{pub,n,f,tot:pub!==null&&f!==null?(pub+f)/2:(pub!==null?pub:f)};
}

/* ===== UMUMIY RO'YXAT (Firebase Realtime Database) ===== */
const DB_URL="https://baraka-d346c-default-rtdb.firebaseio.com";            /* masalan: https://baraka-xxxxx-default-rtdb.firebaseio.com */
const DB_ROOT="baraka_k7x2m9q4pz";
let REMOTE_MSG="";
let REMOTE=null,REMOTE_ERR=false,REMOTE_BUSY=false,REMOTE_AT=0;
let DB_PUT_MSG="";
async function dbPut(path,obj){
 if(!DB_URL)return false;
 try{
  const r=await fetch(DB_URL.replace(/\/$/,"")+"/"+DB_ROOT+"/"+path+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
  DB_PUT_MSG=r.ok?"ok":"HTTP "+r.status;return r.ok;
 }catch(e){DB_PUT_MSG=String(e&&e.message||e);console.warn("DB:",e);return false}
}
async function dbPatch(path,obj){
 if(!DB_URL)return false;
 try{const r=await fetch(DB_URL.replace(/\/$/,"")+"/"+DB_ROOT+"/"+path+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});DB_PUT_MSG=r.ok?"ok":"HTTP "+r.status;return r.ok}catch(e){DB_PUT_MSG=String(e&&e.message||e);return false}
}
const coinRaw=(ph,n)=>dbPut("users/"+ph+"/coins",{".sv":{"increment":n}});
const dbInc=(ph,n)=>{if(n>0&&ph===S.me)weekAdd(n);return coinRaw(ph,n)};
async function dbSyncUser(u){
 if(!u||!DB_URL)return;
 if(!u.joined)u.joined=Date.now();
 const pr=privRole(u.phone);
 try{
  const r=await fetch(DB_URL.replace(/\/$/,"")+"/"+DB_ROOT+"/users/"+u.phone+".json");
  const d=r.ok?await r.json():null;
  if(!d||!d.name){
   await dbPatch("users/"+u.phone,{name:u.name,phone:u.phone,role:pr||(u.role||"member"),joined:u.joined,last:Date.now()});
   if(!d||typeof d.coins!=="number")await coinRaw(u.phone,u.coins||0);
   return;
  }
  await dbPatch("users/"+u.phone,Object.assign({name:u.name,last:Date.now()},pr?{role:pr}:{}));
  if(d.deleted&&u.phone!==FOUNDER_PH){S.users=S.users.filter(x=>x!==u);save();if(S.me===u.phone){S.me=null;render();toast("Hisobingiz o'chirilgan")}return}
  const blk=!!d.blocked&&pr!=="boss"&&u.phone!==FOUNDER_PH;
  if(!S.blk)S.blk={};
  if(blk){S.blk[u.phone]=1;u.active=false;save();if(S.me===u.phone){S.me=null;render();toast("Hisobingiz bloklangan")}return}
  if(S.blk[u.phone]){delete S.blk[u.phone];u.active=true}
  let ch=false;
  const nr=pr||(d.role==="admin"||d.role==="rahbar"?d.role:"member");
  if(u.role!==nr){u.role=nr;ch=true}
  if(typeof d.coins==="number"&&u.coins!==d.coins){u.coins=d.coins;ch=true}
  if(JSON.stringify(d.ach||null)!==JSON.stringify(u.ach||null)){u.ach=d.ach||null;ch=true}
  if(d.joined)u.joined=d.joined;
  if(ch){save();if(ME()&&ME().phone===u.phone)render(true)}
 }catch(e){console.warn("DB:",e)}
}

/* qr-like pattern */
function qr(code){
 let seed=+code,cells="";const n=11;
 const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  const f=(x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
  if(f||rnd()>.52)cells+=`<rect x="${x}" y="${y}" width="1" height="1" rx=".15"/>`;
 }
 return `<svg class="qr" viewBox="0 0 ${n} ${n}" fill="#0a4d2c">${cells}</svg>`;
}

<!-- Telegram: yangi a'zo qo'shilganda xabar -->
<script>
const TELEGRAM_TOKEN = "";
const TELEGRAM_CHAT_ID = "";

async function telegramXabar(matn){
  try{
    const r = await fetch("https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendMessage", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: matn,
        parse_mode: "HTML"
      })
    });
    const data = await r.json();
    if(!data.ok) console.warn("Telegram xatosi:", data);
  }catch(e){
    console.warn("Telegram'ga yuborishda xato:", e);
  }
}
</script>
